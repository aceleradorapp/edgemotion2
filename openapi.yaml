openapi: 3.0.0
info:
  title: EdgeMotion 2.0 API - Documentação Completa
  version: 2.0.0
  description: |
    - Dev: Michael Milanez.

    Esta API permite a gestão completa de projetos, ferramentas, resultados, participantes, grupos e links compartilhados para a plataforma EdgeMotion 2.0.
    Também inclui rotas para autenticação de usuários, gestão de tipos de usuário e perfis.

    A autenticação é feita via Bearer Token (JWT) para a maioria das rotas de gestão, enquanto algumas rotas públicas (como login e acesso a links compartilhados) não exigem autenticação.
servers:
  - url: http://localhost:3030/api
    description: Servidor Local de Desenvolvimento
  - url: https://hub.api.edgemotion.com.br/api
    description: Servidor de Produção (Exemplo)

tags:
  - name: Autenticação
    description: Rotas para registro e login de usuários.
  - name: Usuários e Perfis
    description: Gerenciamento de usuários da empresa, tipos de usuário e perfis.
  - name: Projetos e Ferramentas
    description: Operações relacionadas à gestão de projetos e ferramentas dentro deles.
  - name: Avaliações
    description: Gerenciamento de avaliações, perguntas, respostas e resultados.
  - name: Participantes e Atribuições
    description: Gerenciamento de participantes em projetos e atribuição de avaliações.
  - name: Grupos e Participantes de Grupo
    description: Criação e listagem de grupos e seus participantes.
  - name: Links Compartilhados
    description: Criação e acesso a links públicos para projetos.
  - name: Uploads e Arquivos
    description: Upload de arquivos de usuário, projeto e dados de ferramenta (JSON).
  - name: Mensagens
    description: Criação e gerenciamento de mensagens entre usuários.
  - name: Itens de Menu
    description: Gerenciamento de itens de menu da aplicação.
  - name: Configurações e Plugins de IA
    description: Rotas para gerenciar configurações e plugins de inteligência artificial.
  - name: Pacotes e Áudios
    description: Rotas para lidar com pacotes de projetos e geração de áudios.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Autenticação via token JWT. Inclua o token no cabeçalho 'Authorization' como 'Bearer <YOUR_TOKEN>'.
  schemas:
    UserRegister:
      type: object
      properties:
        email:
          type: string
          format: email
          description: O endereço de e-mail do novo usuário.
        password:
          type: string
          description: A senha do novo usuário.
        displayName:
          type: string
          description: O nome de exibição do novo usuário.
      required:
        - email
        - password
        - displayName
    UserLogin:
      type: object
      properties:
        email:
          type: string
          format: email
          description: O endereço de e-mail do usuário para login.
        password:
          type: string
          description: A senha do usuário para login.
      required:
        - email
        - password
    UserCompany:
      type: object
      properties:
        email:
          type: string
          format: email
          description: O endereço de e-mail do novo usuário.
        password:
          type: string
          description: A senha do novo usuário.
        displayName:
          type: string
          description: O nome de exibição do novo usuário.
        photoUrl:
          type: string
          nullable: true
          description: URL da foto de perfil do usuário.
      required:
        - email
        - password
        - displayName
    UserUpdate:
      type: object
      properties:
        displayName:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        userTypeId:
          type: integer
          nullable: true
        profileId:
          type: integer
          nullable: true
    UserType:
      type: object
      properties:
        code:
          type: integer
          description: O código único para o tipo de usuário.
        name:
          type: string
          description: O nome do tipo de usuário (ex: "Administrador", "Aluno").
        description:
          type: string
          description: Uma descrição detalhada do tipo de usuário e suas permissões.
      required:
        - code
        - name
        - description
    Profile:
      type: object
      properties:
        code:
          type: integer
          description: O código único para o perfil de usuário.
        name:
          type: string
          description: O nome do perfil (ex: "Gerente de Projeto", "Instrutor").
        description:
          type: string
          description: Uma descrição detalhada do perfil e suas responsabilidades.
      required:
        - code
        - name
        - description
    Project:
      type: object
      properties:
        name:
          type: string
          description: O nome do projeto.
        description:
          type: string
          description: Uma descrição detalhada do projeto.
        imageUrl:
          type: string
          nullable: true
          description: A URL da imagem do projeto.
      required:
        - name
        - description
    Tool:
      type: object
      properties:
        projectId:
          type: integer
          format: int64
          description: O ID do projeto ao qual a ferramenta pertence.
        toolType:
          type: string
          description: O tipo da ferramenta (ex: "quiz-alternativas", "drag-drop").
        title:
          type: string
          description: O título da ferramenta.
        description:
          type: string
          description: Uma descrição da ferramenta.
        dataUrl:
          type: string
          format: url
          description: A URL para os dados da ferramenta (ex: o JSON das perguntas do quiz).
        routePage:
          type: string
          nullable: true
        orderNumber:
          type: integer
          description: A ordem de exibição da ferramenta dentro do projeto.
      required:
        - projectId
        - toolType
        - title
        - description
        - dataUrl
        - orderNumber
    ToolResult:
      type: object
      properties:
        toolInstanceId:
          type: integer
          format: int64
          description: O ID da instância da ferramenta a que este resultado se refere.
        participantId:
          type: integer
          format: int64
          description: O ID do participante que gerou este resultado.
        score:
          type: integer
          description: A pontuação obtida pelo participante nesta ferramenta.
        completedAt:
          type: string
          format: date-time
          description: O timestamp de quando o participante completou a ferramenta.
        duration:
          type: integer
          description: A duração em segundos que o participante levou para completar a ferramenta.
        answers:
          type: object
          description: Um objeto JSON contendo as respostas dadas pelo participante.
          additionalProperties:
            type: string
      required:
        - toolInstanceId
        - participantId
        - score
        - completedAt
        - duration
        - answers
    Evaluation:
      type: object
      properties:
        name:
          type: string
          description: O nome da avaliação.
        description:
          type: string
          description: Uma descrição detalhada da avaliação.
        passingPercentage:
          type: number
          format: float
          description: A porcentagem mínima de acertos para a avaliação ser considerada como "passada".
        maxAttempts:
          type: integer
          description: O número máximo de tentativas permitidas para a avaliação.
        companyGuid:
          type: string
          format: uuid
          description: O GUID da empresa à qual a avaliação pertence.
        questions:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationQuestion'
      required:
        - name
        - description
        - passingPercentage
        - companyGuid
        - questions
    EvaluationQuestion:
      type: object
      properties:
        type:
          type: string
          enum: [true_false, multiple_choice_single, multiple_choice_multiple]
          description: O tipo de pergunta da avaliação.
        text:
          type: string
          description: O texto da pergunta.
        options:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationQuestionOption'
      required:
        - type
        - text
        - options
    EvaluationQuestionOption:
      type: object
      properties:
        text:
          type: string
          description: O texto da opção de resposta.
        isCorrect:
          type: boolean
          description: Indica se a opção é a resposta correta.
      required:
        - text
        - isCorrect
    AnswerRequest:
      type: object
      properties:
        questionGuid:
          type: string
          format: uuid
          description: O GUID da pergunta sendo respondida.
        selectedOptions:
          type: array
          items:
            type: string
            format: uuid
          description: Uma lista de GUIDs das opções selecionadas pelo usuário.
        timeTaken:
          type: integer
          description: O tempo em segundos que o usuário levou para responder.
      required:
        - questionGuid
        - selectedOptions
        - timeTaken
    Participant:
      type: object
      description: Representa um participante que pode ser um usuário registrado ou um visitante.
      properties:
        projectId:
          type: integer
          format: int64
          description: O ID do projeto ao qual o participante está associado.
        userId:
          type: integer
          format: int64
          description: O ID do usuário registrado (exclusivo para participantes de usuário).
        guestEmail:
          type: string
          format: email
          description: O e-mail do visitante (exclusivo para participantes visitantes).
      oneOf:
        - required: [projectId, userId]
        - required: [projectId, guestEmail]
    ParticipantStatusUpdate:
      type: object
      properties:
        status:
          type: string
          description: O novo status do participante.
          enum: [finalizado, ativo, pendente]
      required:
        - status
    Group:
      type: object
      properties:
        projectId:
          type: integer
          format: int64
          description: O ID do projeto ao qual o grupo pertence.
        name:
          type: string
          description: O nome do grupo.
        description:
          type: string
          description: Uma descrição do grupo.
      required:
        - projectId
        - name
        - description
    GroupParticipant:
      type: object
      properties:
        groupId:
          type: integer
          format: int64
          description: O ID do grupo ao qual o usuário será adicionado.
        userId:
          type: integer
          format: int64
          description: O ID do usuário a ser adicionado ao grupo.
      required:
        - groupId
        - userId
    SharedLink:
      type: object
      properties:
        projectId:
          type: integer
          format: int64
          description: O ID do projeto para o qual o link de compartilhamento será gerado.
        userId:
          type: integer
          format: int64
          description: O ID do usuário que gerou o link.
        keyword:
          type: string
          description: Uma palavra-chave para o link.
        expiresAt:
          type: string
          format: date-time
          description: A data e hora de expiração do link compartilhado.
      required:
        - projectId
        - userId
        - keyword
        - expiresAt
    SharedLinkUpdate:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
      required:
        - expiresAt
    Assignment:
      type: object
      properties:
        userGuid:
          type: string
          format: uuid
          description: O GUID do usuário que receberá a avaliação.
        evaluationGuid:
          type: string
          format: uuid
          description: O GUID da avaliação a ser atribuída.
      required:
        - userGuid
        - evaluationGuid
    Message:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        recipientIds:
          type: array
          items:
            type: integer
      required:
        - title
        - content
        - recipientIds
    MenuItem:
      type: object
      properties:
        name:
          type: string
        icon:
          type: string
        type:
          type: string
        pathOrAction:
          type: string
        highlight:
          type: boolean
        position:
          type: integer
        minUserTypeId:
          type: integer
      required:
        - name
        - icon
        - type
        - pathOrAction
        - highlight
        - position
        - minUserTypeId
    Component:
      type: object
      properties:
        identifier:
          type: string
        title:
          type: string
        icon:
          type: string
        category:
          type: string
        index:
          type: integer
        route:
          type: string
        userTypeId:
          type: string
        categoryId:
          type: integer
      required:
        - identifier
        - title
        - icon
        - category
        - index
        - route
        - userTypeId
        - categoryId
    ComponentUpdate:
      type: object
      properties:
        title:
          type: string
        icon:
          type: string
        index:
          type: integer
      required:
        - title
        - icon
        - index
    ComponentCategory:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    AIConfig:
      type: object
      properties:
        provider:
          type: string
        apiKey:
          type: string
      required:
        - provider
        - apiKey
    AIPlugin:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        endpointUrl:
          type: string
        enabledGlobally:
          type: boolean
      required:
        - name
        - description
        - imageUrl
        - endpointUrl
        - enabledGlobally
    AIPluginAccess:
      type: object
      properties:
        userIds:
          type: array
          items:
            type: integer
      required:
        - userIds
    AudioGeneration:
      type: object
      properties:
        folderName:
          type: string
        sceneNumber:
          type: integer
        text:
          type: string
      required:
        - folderName
        - sceneNumber
        - text
    AudioDelete:
      type: object
      properties:
        folderName:
          type: string
        sceneNumber:
          type: integer
      required:
        - folderName
        - sceneNumber
    PackageJson:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string
      required:
        - name
        - version
        - description
    SavePackageJson:
      type: object
      properties:
        folderName:
          type: string
        packageJson:
          $ref: '#/components/schemas/PackageJson'
      required:
        - folderName
        - packageJson

paths:
  /auth/register:
    post:
      tags:
        - Autenticação
      summary: Registra um novo usuário
      description: Cria um novo usuário na plataforma com nome, email e senha.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
            example:
              email: "michael.elointer@gmail.com"
              password: "123456"
              displayName: "Michael"
      responses:
        '201':
          description: Usuário registrado com sucesso.
        '400':
          description: Requisição inválida.
  /auth/login:
    post:
      tags:
        - Autenticação
      summary: Realiza o login do usuário
      description: Autentica o usuário e retorna um token JWT para acesso às rotas protegidas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
            example:
              email: "michael@example.com.br"
              password: "12345678"
      responses:
        '200':
          description: Login bem-sucedido. Retorna o token.
        '401':
          description: Credenciais inválidas.
  /auth/me:
    get:
      tags:
        - Autenticação
      summary: Obtém informações do usuário autenticado
      description: Retorna os detalhes do usuário associado ao token JWT fornecido.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Detalhes do usuário obtidos com sucesso.
        '401':
          description: Não autorizado - token ausente ou inválido.

  /projects:
    post:
      tags:
        - Projetos e Ferramentas
      summary: Criar um novo projeto
      description: Permite a criação de um novo projeto na plataforma.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
            example:
              name: "Treinamento EdgeMotion Code"
              description: "Aprendendo a usar o EdgeMotion Code nível 1"
      responses:
        '201':
          description: Projeto criado com sucesso.
        '400':
          description: Requisição inválida - dados do projeto ausentes ou incorretos.
        '401':
          description: Não autorizado - Token JWT ausente ou inválido.
    get:
      tags:
        - Projetos e Ferramentas
      summary: Listar todos os projetos
      description: Lista todos os projetos da plataforma.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de projetos obtida com sucesso.
        '401':
          description: Não autorizado - Token JWT ausente ou inválido.
  /projects/{id}:
    get:
      tags:
        - Projetos e Ferramentas
      summary: Obter detalhes de um projeto
      description: Retorna os detalhes de um projeto específico pelo seu ID.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: O ID do projeto.
      responses:
        '200':
          description: Detalhes do projeto obtidos com sucesso.
        '404':
          description: Projeto não encontrado.
    put:
      tags:
        - Projetos e Ferramentas
      summary: Atualizar um projeto
      description: Atualiza os dados de um projeto existente pelo seu ID.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: O ID do projeto a ser atualizado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
            example:
              name: "Projeto Atualizado 3"
              description: "Descrição atualizada do projeto"
      responses:
        '200':
          description: Projeto atualizado com sucesso.
        '400':
          description: Requisição inválida.
        '401':
          description: Não autorizado - Token JWT ausente ou inválido.
        '404':
          description: Projeto não encontrado.
    delete:
      tags:
        - Projetos e Ferramentas
      summary: Excluir um projeto
      description: Exclui um projeto e todas as suas ferramentas e dados associados.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: O ID do projeto a ser excluído.
      responses:
        '204':
          description: Projeto excluído com sucesso.
        '401':
          description: Não autorizado - Token JWT ausente ou inválido.
        '404':
          description: Projeto não encontrado.
  /projects/showAll:
    get:
      tags:
        - Projetos e Ferramentas
      summary: Listar todos os projetos (sem paginação)
      description: Retorna uma lista completa de todos os projetos na plataforma.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista completa de projetos obtida.

  /tools:
    post:
      tags:
        - Projetos e Ferramentas
      summary: Criar uma nova ferramenta
      description: Cria uma nova ferramenta (ex: quiz) associada a um projeto.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tool'
            example:
              projectId: 11
              toolType: "quiz-alternativas"
              title: "Quiz de Exemplo"
              description: "Quiz com perguntas de múltiplas escolhas"
              dataUrl: "https://meuarquivo.com/dados/quiz1"
              routePage: null
              orderNumber: 5
      responses:
        '201':
          description: Ferramenta criada com sucesso.
        '400':
          description: Requisição inválida.
    get:
      tags:
        - Projetos e Ferramentas
      summary: Listar todas as ferramentas do usuário
      description: Retorna uma lista de todas as ferramentas criadas pelo usuário autenticado.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de ferramentas obtida com sucesso.
  /tools/{id}:
    get:
      tags:
        - Projetos e Ferramentas
      summary: Obter detalhes de uma ferramenta por ID
      description: Retorna os detalhes de uma ferramenta específica.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: O ID da ferramenta.
      responses:
        '200':
          description: Detalhes da ferramenta obtidos com sucesso.
        '404':
          description: Ferramenta não encontrada.
    put:
      tags:
        - Projetos e Ferramentas
      summary: Atualizar uma ferramenta
      description: Atualiza os dados de uma ferramenta existente.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: O ID da ferramenta a ser atualizada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tool'
      responses:
        '200':
          description: Ferramenta atualizada com sucesso.
        '400':
          description: Requisição inválida.
        '404':
          description: Ferramenta não encontrada.
    delete:
      tags:
        - Projetos e Ferramentas
      summary: Excluir uma ferramenta
      description: Exclui uma ferramenta específica.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: O ID da ferramenta a ser excluída.
      responses:
        '204':
          description: Ferramenta excluída com sucesso.
        '404':
          description: Ferramenta não encontrada.
  /tools/{id}/data:
    get:
      tags:
        - Uploads e Arquivos
      summary: Obter dados JSON de uma ferramenta
      description: Retorna o arquivo JSON associado a uma ferramenta pelo seu ID.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: O ID da ferramenta.
      responses:
        '200':
          description: Dados JSON da ferramenta obtidos com sucesso.
        '404':
          description: Ferramenta ou dados não encontrados.
    delete:
      tags:
        - Uploads e Arquivos
      summary: Excluir dados JSON de uma ferramenta
      description: Exclui o arquivo JSON associado a uma ferramenta.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: O ID da ferramenta.
      responses:
        '204':
          description: Dados JSON excluídos com sucesso.
  /tools/project/{projectId}:
    get:
      tags:
        - Projetos e Ferramentas
      summary: Listar ferramentas por projeto
      description: Retorna todas as ferramentas que pertencem a um projeto específico.
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
          description: O ID do projeto.
      responses:
        '200':
          description: Lista de ferramentas obtida com sucesso.
        '404':
          description: Projeto não encontrado.
  /tools/project/getLink/{projectId}:
    get:
      tags:
        - Projetos e Ferramentas
      summary: Listar ferramentas de um projeto por link público
      description: Retorna as ferramentas de um projeto a partir de um link compartilhado.
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
          description: O ID do projeto.
      responses:
        '200':
          description: Lista de ferramentas obtida com sucesso.
        '404':
          description: Projeto não encontrado.

  /results:
    post:
      tags:
        - Avaliações
      summary: Registrar um resultado de ferramenta
