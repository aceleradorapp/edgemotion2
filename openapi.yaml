            format: int64
          required: true
          description: ID do tipo de usuário a ser deletado.
      responses:
        '204':
          description: Tipo de usuário deletado com sucesso. Nenhuma resposta de conteúdo.
        '404':
          description: Tipo de usuário não encontrado com o ID fornecido.
        '401':
          description: Não autorizado - Token JWT ausente ou inválido.

