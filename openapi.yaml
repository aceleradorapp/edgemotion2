              name: "Develop_2"
              description: "Acesso ao sistema"
      responses:
        '200':
          description: Tipo de usuário atualizado com sucesso.
        '404':
          description: Tipo de usuário não encontrado com o ID fornecido.
        '401':
          description: Não autorizado - Token JWT ausente ou inválido.
        '400':
          description: Requisição inválida - Dados de atualização ausentes ou incorretos.
    delete:
      tags:
