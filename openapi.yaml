      summary: Atualizar tipo de usuário por ID
      description: Atualiza as informações (código, nome, descrição) de um tipo de usuário existente utilizando seu ID.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
            format: int64
          required: true
          description: ID do tipo de usuário a ser atualizado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserType'
            example:
