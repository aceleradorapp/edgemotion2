      responses:
        '200':
          description: Login bem-sucedido, retorna o token JWT.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Token JWT para autenticação.
        '401':
          description: Credenciais inválidas (e-mail ou senha incorretos).

